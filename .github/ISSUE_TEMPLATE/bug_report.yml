name: Bug report
description: Report a problem with synthetic or redacted examples only.
body:
  - type: markdown
    attributes:
      value: "Do not attach real chats, journal/index files, credentials, private paths or account output. Use --demo for screenshots. For security issues, read SECURITY.md first."
  - type: input
    id: app-version
    attributes:
      label: AgentJournal version and build type
      placeholder: "0.4.1, local build / ad-hoc Beta / notarized"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS version, architecture and relevant CLI/client versions
      placeholder: "macOS version; Apple Silicon; Codex / Claude CLI / Claude Desktop version (no account details)"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected / actual behavior
      description: "Use a minimal synthetic example. Environment check does not verify login or model access."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: "This report contains no real conversations, journal/index files, credentials, private paths or personal screenshots."
          required: true
